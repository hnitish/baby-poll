<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chotu vs Gudiya: Place Your Bets! 🎰🔮</title>
    <!-- Import beautiful, rounded geometric fonts perfect for a baby poll -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --pink: #ffb6c1;
            --blue: #a8d8ea;
            --text: #4a4a4a;
            --purple: #6c5ce7;
            --green: #2ecc71;
        }
        body {
            font-family: 'Quicksand', sans-serif;
            font-weight: 500;
            /* A gorgeous 3-point pastel gradient layered with a subtle repeating milk bottle and diaper pattern */
            background: 
                linear-gradient(145deg, rgba(255, 243, 245, 0.93) 0%, rgba(247, 245, 255, 0.93) 50%, rgba(232, 247, 252, 0.93) 100%),
                url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><text x="20" y="40" font-size="16" opacity="0.12">🍼</text><text x="70" y="80" font-size="16" opacity="0.12">🩲</text></svg>');
            background-repeat: repeat;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 45px 40px;
            border-radius: 28px;
            /* Soft, deep shadow to make the form beautifully float over the pattern */
            box-shadow: 0 20px 40px rgba(108, 92, 231, 0.06);
            max-width: 520px;
            width: 100%;
            text-align: center;
            box-sizing: border-box;
            position: relative;
            overflow: hidden;
        }
        h1 { 
            font-family: 'Fredoka', sans-serif;
            font-weight: 700;
            margin-top: 0;
            margin-bottom: 12px; 
            color: var(--purple); 
            font-size: 2.4rem;
            letter-spacing: -0.5px;
        }
        p { 
            color: #777; 
            margin-bottom: 35px; 
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .section { 
            margin-bottom: 28px; 
            text-align: left; 
        }
        label { 
            font-family: 'Fredoka', sans-serif;
            font-weight: 600; 
            display: block; 
            margin-bottom: 10px; 
            font-size: 1rem;
            color: #333;
        }
        
        /* Gender Selection Styling */
        .gender-options {
            display: flex;
            gap: 16px;
            margin-top: 5px;
        }
        .gender-btn {
            flex: 1;
            padding: 16px;
            border: 2px solid #eaeaea;
            border-radius: 16px;
            cursor: pointer;
            text-align: center;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            font-size: 1.05rem;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }
        .gender-btn.boy:hover { border-color: var(--blue); background: #f7fcfe; transform: scale(1.02); }
        .gender-btn.girl:hover { border-color: var(--pink); background: #fff9fa; transform: scale(1.02); }
        
        input[type="radio"] { display: none; }
        input[type="radio"]:checked + .gender-btn.boy { background: var(--blue); border-color: #8ecae6; color: white; transform: scale(1.02); }
        input[type="radio"]:checked + .gender-btn.girl { background: var(--pink); border-color: #ff9aa2; color: white; transform: scale(1.02); }

        /* Inputs & Selects */
        select, input[type="text"] {
            font-family: 'Quicksand', sans-serif;
            font-weight: 700;
            width: 100%;
            padding: 15px;
            border: 2px solid #eee;
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
            background-color: #fafafa;
            color: var(--text);
        }
        select:focus, input[type="text"]:focus { 
            border-color: var(--purple); 
            background-color: #fff;
            box-shadow: 0 0 0 4px rgba(108, 92, 231, 0.08);
        }
        
        button[type="submit"] {
            font-family: 'Fredoka', sans-serif;
            background: var(--purple);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 1.15rem;
            border-radius: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: 700;
            box-shadow: 0 6px 20px rgba(108, 92, 231, 0.25);
            transition: all 0.2s ease;
            margin-top: 10px;
        }
        button[type="submit"]:hover { background: #5b4cc4; transform: translateY(-2px); box-shadow: 0 8px 25px rgba(108, 92, 231, 0.35); }
        button[type="submit"]:active { transform: translateY(0); }

        /* Hidden Frame Trick */
        #hidden_iframe {
            display: none;
        }

        /* Thank You Screen Styles */
        #success-message {
            display: none; /* Hidden by default */
            animation: fadeIn 0.6s ease forwards;
        }
        .success-icon {
            font-size: 4.5rem;
            margin-bottom: 20px;
            display: inline-block;
            animation: bounce 2s infinite ease-in-out;
        }
        .success-title {
            font-family: 'Fredoka', sans-serif;
            color: var(--purple);
            font-size: 2.2rem;
            margin-bottom: 15px;
        }
        .success-text {
            font-size: 1.15rem;
            color: #555;
            line-height: 1.6;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- The main poll container that will hide upon click -->
    <div id="poll-content">
        <h1>Baby Prediction Poll! 👶🏻</h1>
        <p>Cast your vote and help us settle the family debates! 📢💭</p>

        <!-- Form target points to the hidden iframe below -->
        <form action="https://docs.google.com/forms/u/0/d/e/1FAIpQLSckfnJTUBhkDYrLKBVfUFQ3ersx7TqA3jUV70iPFL6kemRskg/formResponse" 
              method="POST" 
              target="hidden_iframe" 
              onsubmit="showThankYouMessage();">
            
            <!-- Voter Identity Field -->
            <div class="section">
                <label for="voter-name">Who is guessing? 📝</label>
                <input type="text" name="entry.1344783608" id="voter-name" placeholder="Type your name here..." required>
            </div>

            <!-- Guess Field -->
            <div class="section">
                <label>What is your final guess? 🔮✨</label>
                <div class="gender-options">
                    <label style="flex:1;">
                        <input type="radio" name="entry.1062569499" value="Boy" required>
                        <div class="gender-btn boy">💙 Team Boy 👦🏻 🍼</div>
                    </label>
                    <label style="flex:1;">
                        <input type="radio" name="entry.1062569499" value="Girl" required>
                        <div class="gender-btn girl">💖 Team Girl 👧🏻 🍼</div>
                    </label>
                </div>
            </div>

            <!-- Boy Suggestion Field -->
            <div class="section">
                <label for="boy-suggestion">Have a boy name in mind? (Before the elders decide! 👴🏽)</label>
                <input type="text" name="entry.730342018" id="boy-suggestion" placeholder="Type your idea here..." >
            </div>
            
            <!-- Girl Suggestion Field -->
            <div class="section">
                <label for="girl-suggestion">Have a girl name in mind? (Easy to pronounce, please! 🗣️)</label>
                <input type="text" name="entry.1558740965" id="girl-suggestion" placeholder="Type your idea here..." >
            </div>

            <button type="submit">Submit My Guess! 🗳️🧿✨</button>
        </form>
    </div>

    <!-- This custom screen shows instantly when the submit button is clicked -->
    <div id="success-message">
        <div class="success-icon">🧿✨👶🏻</div>
        <h2 class="success-title">Guess Registered!</h2>
        <p class="success-text">
            Thank you so much for locks-in your prediction! Your answers have been saved safely. <br><br>
            Let's see if it turns out to be a charming <strong>Chotu</strong> or a sweet <strong>Gudiya</strong>!🩵🩷
        </p>
    </div>
</div>

<!-- The secret hidden gateway that absorbs Google Form's redirect -->
<iframe name="hidden_iframe" id="hidden_iframe"></iframe>

<script>
    function showThankYouMessage() {
        // Instantly hide the form components
        document.getElementById('poll-content').style.display = 'none';
        // Instantly display our elegant, integrated thank-you block
        document.getElementById('success-message').style.display = 'block';
    }
</script>

</body>
</html>
